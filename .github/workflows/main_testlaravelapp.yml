# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - testlaravelapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: composer validate --no-check-publish && composer install --prefer-dist --no-progress

      - name: Restructure app so public/ is the served webroot
        # Azure App Service's PHP (Linux, Code deploy) serves straight out of the
        # package root and its Nginx config can't be repointed at public/, so move
        # public/'s contents to the package root and the rest of the app into a
        # laravel/ subfolder, patching index.php's paths to match.
        run: |
          shopt -s dotglob
          mkdir deploy_root
          mkdir deploy_root/laravel
          for item in *; do
            case "$item" in
              public|deploy_root|.git|.github) continue ;;
            esac
            mv "$item" deploy_root/laravel/
          done
          mv public/* deploy_root/
          rmdir public
          sed -i "s#__DIR__\.'/\.\./#__DIR__.'/laravel/#g" deploy_root/index.php

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: deploy_root
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E39CDBBCB5D6460184FE9CFE1406C0B8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_371DDDF8BD9D440B97BA97CB94C4EB94 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8776BF98EC9B4D119E5DFCD120563713 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'testlaravelapp'
          slot-name: 'Production'
          package: .
          clean: true

      - name: Run database migrations
        # This runtime has no php-cli/SSH access, so migrations run via an
        # HTTP deploy hook route in the app itself (routes/web.php) instead
        # of `artisan migrate` out-of-band.
        run: |
          sleep 15
          curl -sS -f -X POST \
            -H "X-Migrate-Token: ${{ secrets.MIGRATE_TOKEN }}" \
            https://testlaravelapp-hkd5b0dqeabrb7g7.uaenorth-01.azurewebsites.net/__deploy/migrate